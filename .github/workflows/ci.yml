name: reliability-contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_evidence.py
      - run: python scripts/demo.py --out runs/ci --repeats 1
      - uses: actions/upload-artifact@v4
        with:
          name: reliability-evidence-${{ matrix.python }}
          path: |
            runs/ci/**/*.json
